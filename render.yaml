services:
  - type: web
    name: general-store-owner
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://kirana-backend-mb03.onrender.com/api
      - key: VITE_SOCKET_URL
        value: https://kirana-backend-mb03.onrender.com
